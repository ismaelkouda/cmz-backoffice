<div class="privacy-policy-page">
    <div class="privacy-policy-card">
        <div class="privacy-policy-card-head">
            <h1 class="privacy-policy-title">
                {{ 'PRIVACY_POLICY.DIALOG.TITLE' | translate }}
            </h1>
        </div>

        <div class="privacy-policy-card-body">
            @if (content()) {
                <div
                    class="privacy-policy-content"
                    [innerHTML]="content()!"
                ></div>
            } @else {
                <p class="privacy-policy-empty">
                    {{ 'PRIVACY_POLICY.DIALOG.EMPTY' | translate }}
                </p>
            }
        </div>

        <div class="privacy-policy-consent">
            <p-checkbox
                [binary]="true"
                [inputId]="'privacy-policy-page-ack'"
                [(ngModel)]="acknowledged"
            />
            <label
                for="privacy-policy-page-ack"
                class="privacy-policy-consent-label"
            >
                {{ 'PRIVACY_POLICY.DIALOG.ACKNOWLEDGE' | translate }}
            </label>
        </div>

        <div class="privacy-policy-actions">
            <p-button
                [label]="'PRIVACY_POLICY.DIALOG.DISCONNECT' | translate"
                severity="secondary"
                [text]="true"
                (onClick)="onDisconnect()"
            ></p-button>
            <p-button
                [label]="'PRIVACY_POLICY.DIALOG.CONTINUE' | translate"
                icon="pi pi-check"
                [loading]="saving()"
                [disabled]="!canContinue()"
                (onClick)="onContinue()"
            ></p-button>
        </div>
    </div>
</div>

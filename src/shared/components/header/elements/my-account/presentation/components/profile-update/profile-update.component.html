<form [formGroup]="accountForm" (ngSubmit)="saveAccount()">
    <div class="modal-header">
        <h4 class="modal-title">
            {{ 'MY_ACCOUNT.ACCOUNT.FORM.TITLE' | translate }}
        </h4>
        <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="closeModal()"
        ></button>
    </div>
    <div class="modal-body">
        <div class="form-grid">
            <div class="form-group">
                <label for="lastName"
                    >Nom<span class="text-danger">*</span></label
                >
                <input
                    id="lastName"
                    class="form-input"
                    type="text"
                    formControlName="lastName"
                    [class.form-input--invalid]="
                        isAccountFieldInvalid('lastName')
                    "
                    [class.form-input--valid]="isAccountFieldValid('lastName')"
                />
            </div>
            <div class="form-group">
                <label for="firstName"
                    >Prénom<span class="text-danger">*</span></label
                >
                <input
                    id="firstName"
                    class="form-input"
                    type="text"
                    formControlName="firstName"
                    [class.form-input--invalid]="
                        isAccountFieldInvalid('firstName')
                    "
                    [class.form-input--valid]="isAccountFieldValid('firstName')"
                />
            </div>
            <div class="form-group">
                <label for="email"
                    >Email<span class="text-danger">*</span></label
                >
                <input
                    id="email"
                    class="form-input"
                    type="email"
                    formControlName="email"
                    [class.form-input--invalid]="isAccountFieldInvalid('email')"
                    [class.form-input--valid]="isAccountFieldValid('email')"
                />
                @if (accountError('email')) {
                    <small class="text-danger">{{
                        accountError('email') | translate
                    }}</small>
                }
            </div>
            <div class="form-group">
                <label for="phone"
                    >Téléphone<span class="text-danger">*</span></label
                >
                <p-inputMask
                    id="phone"
                    formControlName="phone"
                    mask="99-99-99-99-99"
                    [unmask]="true"
                    [styleClass]="
                        'form-input' +
                        (isAccountFieldInvalid('phone')
                            ? ' form-input--invalid'
                            : '') +
                        (isAccountFieldValid('phone')
                            ? ' form-input--valid'
                            : '')
                    "
                />
                @if (accountError('phone')) {
                    <small class="text-danger">{{
                        accountError('phone') | translate
                    }}</small>
                }
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-hide" (click)="closeModal()">
            {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
            type="submit"
            class="btn btn-save"
            [disabled]="accountForm.invalid || loading()"
        >
            {{ 'COMMON.SAVE' | translate }}
        </button>
    </div>
</form>

<form [formGroup]="passwordForm" (ngSubmit)="savePassword()">
    <div class="modal-header">
        <h4 class="modal-title">
            {{ 'MY_ACCOUNT.PASSWORD.FORM.TITLE' | translate }}
        </h4>
        <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="closeModal()"
        ></button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label for="oldPassword"
                >Ancien mot de passe<span class="text-danger">*</span></label
            >
            <p-password
                id="oldPassword"
                formControlName="oldPassword"
                [feedback]="false"
                [toggleMask]="true"
                [inputStyleClass]="
                    'form-input' +
                    (isPasswordFieldInvalid('oldPassword')
                        ? ' form-input--invalid'
                        : '') +
                    (isPasswordFieldValid('oldPassword')
                        ? ' form-input--valid'
                        : '')
                "
            />
        </div>
        <div class="form-group">
            <label for="newPassword"
                >Nouveau mot de passe<span class="text-danger">*</span></label
            >
            <p-password
                id="newPassword"
                formControlName="newPassword"
                [feedback]="false"
                [toggleMask]="true"
                [inputStyleClass]="
                    'form-input' +
                    (isPasswordFieldInvalid('newPassword')
                        ? ' form-input--invalid'
                        : '') +
                    (isPasswordFieldValid('newPassword')
                        ? ' form-input--valid'
                        : '')
                "
            />
            @if (passwordError('newPassword')) {
                <small class="text-danger">{{
                    passwordError('newPassword') | translate
                }}</small>
            }
        </div>
        <div class="form-group">
            <label for="confirmNewPassword"
                >Confirmation<span class="text-danger">*</span></label
            >
            <p-password
                id="confirmNewPassword"
                formControlName="confirmNewPassword"
                [feedback]="false"
                [toggleMask]="true"
                [inputStyleClass]="
                    'form-input' +
                    (isPasswordFieldInvalid('confirmNewPassword')
                        ? ' form-input--invalid'
                        : '') +
                    (isPasswordFieldValid('confirmNewPassword')
                        ? ' form-input--valid'
                        : '')
                "
            />
            @if (passwordError('confirmNewPassword')) {
                <small class="text-danger">{{
                    passwordError('confirmNewPassword') | translate
                }}</small>
            }
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-hide" (click)="closeModal()">
            {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
            type="submit"
            class="btn btn-save"
            [disabled]="passwordForm.invalid || loading()"
        >
            Valider
        </button>
    </div>
</form>

<div class="password-strength" [class]="hostClass()">
    <div
        class="password-strength__meter"
        role="progressbar"
        aria-valuemin="0"
        [attr.aria-valuemax]="totalCount()"
        [attr.aria-valuenow]="metCount()"
    >
        @for (active of segments(); track $index) {
            <span
                class="password-strength__segment"
                [class.password-strength__segment--active]="active"
            ></span>
        }
    </div>
    <!-- @if (value()) {
        <span class="password-strength__label">{{
            'PASSWORD_STRENGTH.LEVELS.' + level() | translate
        }}</span>
    } -->
    <ul class="password-strength__rules">
        @for (rule of rules(); track rule.key) {
            <li
                class="password-strength__rule"
                [class.password-strength__rule--met]="rule.met"
            >
                <i
                    class="pi password-strength__rule-icon"
                    [class.pi-check]="rule.met"
                    [class.pi-circle]="!rule.met"
                ></i>
                <span>{{
                    'PASSWORD_STRENGTH.RULES.' + rule.key | translate
                }}</span>
            </li>
        }
    </ul>
</div>

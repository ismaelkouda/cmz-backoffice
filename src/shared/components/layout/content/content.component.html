<div>
    <div
        class="page-wrapper compact-wrapper"
        id="canvas-bookmark"
        [ngClass]="layoutClass"
    >
        <header class="header">
            <app-header
                [collapseSidebar]="navServices.collapseSidebar"
            ></app-header>
        </header>
        <div class="page-body-wrapper">
            <div
                class="sidebar-wrapper"
                [class.close_icon]="navServices.collapseSidebar"
            >
                <app-sidebar></app-sidebar>
            </div>
            <div class="page-body">
                <main>
                    <div class="container-fluid">
                        <ng-container *ngIf="showTabs">
                            <div class="sticky-tabs-wrapper">
                                <app-tabs></app-tabs>
                            </div>
                        </ng-container>

                        <div class="page-content-wrapper">
                            <router-outlet #o="outlet"></router-outlet>
                        </div>
                    </div>
                </main>
            </div>
            <footer class="footer">
                <app-footer></app-footer>
            </footer>
        </div>
    </div>
</div>
<div class="bg-overlay1"></div>

<div class="radio-relay-links-content">
    <app-filter
        class="filter-component"
        [isLoading]="loading()"
        [formGroup]="form"
        [fields]="filterFields()"
        (filter)="onFilterClicked()"
        [filterState]="facade.currentFilter$"
        [limit]="5"
    ></app-filter>

    <hr class="radio-relay-links-divider" />

    <section class="table-section">
        <app-table
            class="table-component"
            [loading]="loading()"
            [items]="itemsVM()"
            [pagination]="pagination()"
            [config]="tableConfig"
            [headerButtons]="headerButtons()"
            (headerButtonClicked)="onHeaderClicked($event)"
            (actionClicked)="onActionClicked($event)"
            dataKey="uniqId"
        ></app-table>

        <app-pagination
            class="pagination-component"
            [pagination]="pagination()"
            (pageChange)="onChangePageClicked($event)"
        ></app-pagination>
    </section>
</div>

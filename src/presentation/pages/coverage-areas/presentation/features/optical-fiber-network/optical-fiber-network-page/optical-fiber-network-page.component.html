<main class="container-fluid optical-fiber-network-page-container" role="main">
    <section class="row optical-fiber-network-page-row">
        <article class="col-sm-12 optical-fiber-network-page-article">
            <app-breadcrumb />

            <section class="card optical-fiber-network-page-card">
                <div class="card-body optical-fiber-network-page-card-body">
                    <header class="optical-fiber-network-page-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'COVERAGE_AREAS.OPTICAL_FIBER_NETWORK.TITLE'
                                    | translate
                            "
                        />
                    </header>

                    <p-tabs lazy [value]="activeTab()">
                        <p-tablist>
                            @for (tab of tabs; track tab.value) {
                                <p-tab
                                    [value]="tab.route"
                                    [routerLink]="tab.route"
                                    [queryParams]="tab.queryParams"
                                >
                                    <i [class]="tab.icon"></i>
                                    <span>{{ tab.label | translate }}</span>
                                </p-tab>
                            }
                        </p-tablist>
                    </p-tabs>

                    <router-outlet></router-outlet>
                </div>
            </section>
        </article>
    </section>
</main>

<main class="container-fluid all-container" role="main">
    <section class="row all-row">
        <article class="col-sm-12 all-article">
            <app-breadcrumb />

            <section class="card all-card">
                <div class="card-body all-card-body">
                    <header class="all-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'REPORTS_REQUESTS.ALL.TITLE'
                                    | translate
                                    | lowercase
                            "
                        >
                        </app-page-title>
                    </header>

                    <div class="all-content" [class.fade-in]="hasAnimated()">
                        <app-filter
                            class="filter-component"
                            [isLoading]="isLoading()"
                            [formGroup]="formFilter"
                            [fields]="filterFields"
                            [filterState]="facade.currentFilter$"
                            (filter)="filter($event)"
                            [limit]="4"
                        >
                        </app-filter>

                        <hr class="all-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                [loading]="isLoading()"
                                [items]="allItems()"
                                [config]="tableConfig"
                                [pagination]="pagination()"
                                (refreshRequested)="refreshAll()"
                                (actionClicked)="onActionClicked($event)"
                                (export)="onExportExcel()"
                                [hiddenButtonOther]="true"
                                dataKey="uniqId"
                            >
                            </app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onPageChange($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>

    @if (reportTreatmentVisible) {
        <app-management
            [(visible)]="reportTreatmentVisible"
            [reportId]="selectedReportId"
            (closed)="onReportTreatmentClosed()"
        ></app-management>
    }
</main>

<div class="hashtags-container">
    <div class="d-flex flex-column gap-2">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <div class="flex-grow-1">
                <input
                    class="form-input w-100"
                    [formControl]="inputControl"
                    [placeholder]="placeholder() | translate"
                    (keydown.enter)="addHashtag($event)"
                    [disabled]="isDisabled"
                />

                @if (inputError()) {
                    <small class="text-danger d-block mt-1">
                        {{ inputError() | translate }}
                    </small>
                }
            </div>

            @if (canClearAll()) {
                <p-button
                    type="button"
                    icon="pi pi-trash"
                    [rounded]="true"
                    [text]="true"
                    [severity]="'danger'"
                    (onClick)="clearAll()"
                    [disabled]="isDisabled"
                />
            }
        </div>

        @if (showStats()) {
            <small class="text-muted">
                {{ hashtagsCount() }} / {{ maxHashtags() || '∞' }}
            </small>
        }

        @if (hashtags().length > 0) {
            <div class="hashtags-list">
                <div class="d-flex flex-wrap gap-2">
                    @for (
                        hashtag of hashtags();
                        track hashtag;
                        let i = $index
                    ) {
                        <div class="d-flex align-items-center gap-1">
                            <p-tag
                                [value]="hashtag"
                                [severity]="'info'"
                                [rounded]="true"
                                styleClass="p-2"
                            >
                            </p-tag>
                            <button
                                type="button"
                                class="remove-hashtag-btn p-0 border-0 bg-transparent"
                                (click)="removeHashtag(i)"
                                [disabled]="isDisabled"
                            >
                                <i class="pi pi-times text-danger"></i>
                            </button>
                        </div>
                    }
                </div>
            </div>
        }
    </div>
</div>

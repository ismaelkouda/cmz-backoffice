<main class="container-fluid slide-container" role="main">
    <section class="row slide-row">
        <article class="col-sm-12 slide-article">
            <app-breadcrumb />

            <section class="card slide-card">
                <div class="card-body slide-card-body">
                    <header class="slide-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'CONTENT_MANAGEMENT.SLIDE.TITLE'
                                    | translate
                                    | lowercase
                            "
                        ></app-page-title>
                    </header>

                    <div class="slide-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked($event)"
                            [filterState]="facade.currentFilter$"
                            [limit]="5"
                        ></app-filter>

                        <hr class="slide-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                [loading]="loading()"
                                [items]="items()"
                                [pagination]="pagination()"
                                [config]="tableConfig"
                                [headerButtons]="headerButtons()"
                                (headerButtonClicked)="
                                    onHeaderButtonClicked($event)
                                "
                                (refreshRequested)="onRefreshClicked()"
                                (createRequested)="
                                    onHeaderButtonClicked($event)
                                "
                                (editRequested)="onNavigateToForm($event)"
                                (deleteRequested)="onDeleteClicked($event)"
                                (enableRequested)="onEnableClicked($event)"
                                (disableRequested)="onDisableClicked($event)"
                                dataKey="uniqId"
                            ></app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onPageChangeClicked($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>
</main>

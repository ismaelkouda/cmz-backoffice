<main class="container-fluid terms-use-container" role="main">
    <section class="row terms-use-row">
        <article class="col-sm-12 terms-use-article">
            <app-breadcrumb />

            <section class="card terms-use-card">
                <div class="card-body terms-use-card-body">
                    <header class="terms-use-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'CONTENT_MANAGEMENT.TERMS_USE.TITLE' | translate
                            "
                        ></app-page-title>
                    </header>

                    <p-tabs lazy [value]="activeTab()">
                        <p-tablist>
                            @for (tab of tabs; track tab.value) {
                                <p-tab
                                    [value]="tab.route"
                                    [routerLink]="tab.route"
                                    [queryParams]="tab.queryParams"
                                >
                                    <i [class]="tab.icon"></i>
                                    <span>{{ tab.label | translate }}</span>
                                </p-tab>
                            }
                        </p-tablist>
                    </p-tabs>

                    <router-outlet></router-outlet>
                </div>
            </section>
        </article>
    </section>
</main>

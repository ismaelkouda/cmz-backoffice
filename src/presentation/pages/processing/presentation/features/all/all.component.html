<main class="container-fluid all-container" role="main">
    <section class="row all-row">
        <article class="col-sm-12 all-article">
            <app-breadcrumb />

            <section class="card all-card">
                <div class="card-body all-card-body">
                    <header class="all-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="'PROCESSING.ALL.TITLE' | translate"
                        >
                        </app-page-title>
                    </header>

                    <div class="all-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked()"
                            [filterState]="facade.currentFilter$"
                            [limit]="4"
                        ></app-filter>

                        <hr class="all-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                dataKey="uniqId"
                                [config]="tableConfig"
                                [loading]="loading()"
                                [headerButtons]="headerButtons()"
                                [items]="itemsVM()"
                                [pagination]="pagination()"
                                (actionClicked)="onActionClicked($event)"
                                (headerButtonClicked)="onHeaderClicked($event)"
                            >
                            </app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onVisibleDialogClicked($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>

    @if (isVisibleDialog()) {
        <app-management-dialog
            [visible]="isVisibleDialog()"
            [uniqId]="selectedReportId()"
            [type]="selectedManagementType()"
            (visibleChange)="onVisibleDialogClicked($event)"
        ></app-management-dialog>
    }
</main>

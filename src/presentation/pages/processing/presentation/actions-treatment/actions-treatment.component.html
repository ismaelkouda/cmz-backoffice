<p-dialog
    [visible]="displayModal()"
    (visibleChange)="displayModal.set($event)"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [dismissableMask]="true"
    [style]="{ width: '45rem' }"
    [resizable]="false"
    header="{{
        'TEAM_ORGANIZATION.TEAMS.PARTICIPANTS.MODAL.REASSIGN_TITLE' | translate
    }}"
>
    <form [formGroup]="form">
        <div class="row g-3">
            <div class="col-md-6 form-group">
                <label for="team">
                    <b
                        >{{ 'ACTIONS.FIELDS.DATE' | translate }}
                        <span class="text-danger">*</span>
                    </b>
                </label>
                <p-datepicker
                    formControlName="date"
                    [showIcon]="true"
                    [readonlyInput]="true"
                    dateFormat="yy-mm-dd"
                    appendTo="body"
                    class="form-control"
                ></p-datepicker>
            </div>
            <div class="col-md-6 form-group">
                <label for="action-type">
                    {{ 'ACTIONS.FIELDS.TYPE' | translate }}
                    <span class="required">*</span>
                </label>
                <p-select
                    id="action-type"
                    formControlName="type"
                    [options]="actionsTypesOptions()"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="{{ 'ACTIONS.PLACEHOLDERS.TYPE' | translate }}"
                    class="form-control"
                ></p-select>
            </div>
        </div>

        <div class="form-group">
            <label for="action-description">
                {{ 'ACTIONS.FIELDS.DESCRIPTION' | translate }}
                <span class="required">*</span>
            </label>
            <textarea
                id="action-description"
                pInputTextarea
                formControlName="description"
                rows="4"
                maxlength="255"
                placeholder="{{
                    'ACTIONS.PLACEHOLDERS.DESCRIPTION' | translate
                }}"
                class="form-control"
            ></textarea>
        </div>

        <div class="form-group toggle-group">
            <div class="toggle-container">
                <label for="action-notify" class="toggle-label">
                    {{ 'ACTIONS.FIELDS.NOTIFY_USERS' }}
                </label>
                <p-toggleswitch
                    id="action-notify"
                    formControlName="shouldNotifyUser"
                ></p-toggleswitch>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <p-button
            [label]="'COMMON.CANCEL' | translate"
            icon="pi pi-times"
            severity="danger"
            (onClick)="closeModal()"
        ></p-button>
        <p-button
            [label]="'COMMON.SAVE' | translate"
            [icon]="
                facade.actionState() === 'loading'
                    ? 'pi pi-spin pi-spinner'
                    : 'pi pi-check'
            "
            (onClick)="onSubmit()"
            [disabled]="form.invalid || facade.actionState() === 'loading'"
        ></p-button>
    </ng-template>
</p-dialog>

<div class="users-content">
    <section class="table-section">
        <app-table
            class="table-component"
            [loading]="loading()"
            [items]="itemsVM()"
            [pagination]="pagination()"
            [config]="tableConfig"
            [headerButtons]="headerButtons()"
            (headerButtonClicked)="onCreateClicked($event)"
            (refreshRequested)="onRefreshClicked()"
            (createRequested)="onCreateClicked($event)"
            (editRequested)="onNavigateToForm($event)"
            (deleteRequested)="onDeleteClicked($event)"
            (enableRequested)="onEnableClicked($event)"
            (disableRequested)="onDisableClicked($event)"
            [hiddenButtonOther]="false"
            dataKey="uniqId"
        ></app-table>

        <app-pagination
            class="pagination-component"
            [pagination]="pagination()"
            (pageChange)="onChangePageClicked($event)"
        ></app-pagination>
    </section>
</div>

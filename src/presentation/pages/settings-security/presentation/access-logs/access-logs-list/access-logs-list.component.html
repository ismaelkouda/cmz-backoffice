<main class="container-fluid access-logs-container" role="main">
    <section class="row access-logs-row">
        <article class="col-sm-12 access-logs-article">
            <app-breadcrumb />

            <section class="card access-logs-card">
                <div class="card-body access-logs-card-body">
                    <header class="access-logs-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'SETTINGS_SECURITY.ACCESS_LOGS.TITLE'
                                    | translate
                            "
                        ></app-page-title>
                    </header>

                    <div class="access-logs-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked()"
                            [filterState]="facade.currentFilter$"
                            [limit]="5"
                        ></app-filter>

                        <hr class="access-logs-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                dataKey="uniqId"
                                [config]="tableConfig"
                                [loading]="loading()"
                                [headerButtons]="headerButtons()"
                                [items]="itemsVM()"
                                [pagination]="pagination()"
                                (headerButtonClicked)="
                                    onHeaderButtonClicked($event)
                                "
                            ></app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onChangePageClicked($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>
</main>

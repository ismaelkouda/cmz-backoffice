<main class="container-fluid profiles-permissions-users-container" role="main">
    <section class="row profiles-permissions-users-row">
        <article class="col-sm-12 profiles-permissions-users-article">
            <app-breadcrumb />

            <section class="card profiles-permissions-users-card">
                <div class="card-body profiles-permissions-users-card-body">
                    <header class="profiles-permissions-users-header">
                        <div class="d-flex align-items-center">
                            <app-page-title
                                class="page-title-component"
                                [displayDate]="false"
                                [title]="
                                    'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.TITLE'
                                        | translate
                                        | lowercase
                                "
                            >
                            </app-page-title>
                            <div class="ms-auto">
                                <p-tag
                                    severity="success"
                                    [value]="paramsName()"
                                />
                            </div>
                        </div>
                        <p-button
                            [label]="'COMMON.CLOSE' | translate"
                            (onClick)="navigateToBack()"
                            styleClass="p-button-danger"
                        >
                        </p-button>
                    </header>

                    <div class="fade-in profiles-permissions-users-content">
                        <!-- <div class="report-subtitle">
                            <div class="subtitle-item">
                                <span class="subtitle-label"
                                    >'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.NAME' | translate:</span
                                >
                                <p-tag
                                    [value]="departmentName()"
                                    [styleClass]="
                                        'department-name-tag ' +departmentName()"
                                    [rounded]="true"
                                ></p-tag>
                            </div>

                            <div class="subtitle-item">
                                <span class="subtitle-label">'COMMON.CREATED_AT' | translate:</span>
                                <span class="subtitle-value">{{departmentCreatedAt()}}</span>
                            </div>
                        </div> -->

                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilter($event)"
                            [filterState]="facade.currentFilter$"
                            [limit]="5"
                        ></app-filter>

                        <hr class="profiles-permissions-users-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                [loading]="loading()"
                                [items]="item()"
                                [pagination]="pagination()"
                                [config]="tableConfig"
                                (refreshRequested)="onRefresh()"
                                dataKey="uniqId"
                                [headerButtons]="headerButtons()"
                                selectionMode="multiple"
                                [selection]="usersSelectedInTable()"
                                (selectionChange)="onSelectionChange($event)"
                                (headerButtonClicked)="
                                    onHeaderButtonClicked($event)
                                "
                            ></app-table>
                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onPageChange($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>
</main>

<ng-template #reassignModal let-modal>
    <form [formGroup]="reassignForm">
        <div class="modal-header">
            <h4 class="modal-title">
                {{
                    'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.REASSIGN_MODAL.TITLE'
                        | translate
                }}
            </h4>
            <button
                type="button"
                class="btn-close"
                aria-label="Close"
                (click)="closeReassignModal()"
            ></button>
        </div>
        <div class="modal-body" novalidate>
            <div class="form-group mb-3">
                <label for="profile" class="form-label">
                    <b
                        >{{
                            'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.REASSIGN_MODAL.PROFILE_LABEL'
                                | translate
                        }}
                        <span class="text-danger">*</span></b
                    >
                </label>
                <p-select
                    id="profile"
                    formControlName="profile"
                    [options]="profiles()"
                    optionLabel="label"
                    optionValue="value"
                    appendTo="body"
                    [placeholder]="
                        'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.REASSIGN_MODAL.PROFILE_PLACEHOLDER'
                            | translate
                    "
                    [style]="{ width: '100%' }"
                    [class.ng-invalid]="
                        reassignForm.get('profile')?.invalid &&
                        reassignForm.get('profile')?.touched
                    "
                ></p-select>
                @if (
                    reassignForm.get('profile')?.invalid &&
                    reassignForm.get('profile')?.touched
                ) {
                    <small class="text-danger">
                        {{
                            'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.REASSIGN_MODAL.PROFILE_REQUIRED'
                                | translate
                        }}
                    </small>
                }
            </div>
        </div>
        <div class="modal-footer">
            <button
                type="button"
                class="btn btn-secondary"
                (click)="closeReassignModal()"
            >
                {{ 'COMMON.CANCEL' | translate }}
            </button>
            <button
                type="button"
                class="btn btn-primary"
                (click)="onSubmitReassign()"
                [disabled]="reassignForm.invalid"
            >
                {{ 'COMMON.VALIDATE' | translate }}
            </button>
        </div>
    </form>
</ng-template>

<p-dialog
    [visible]="displayReassignModal()"
    (visibleChange)="displayReassignModal.set($event)"
    [modal]="true"
    [style]="{ width: '450px' }"
    [draggable]="false"
    [resizable]="false"
    header="{{
        'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.REASSIGN_MODAL.TITLE'
            | translate
    }}"
>
    <form [formGroup]="reassignForm">
        <div class="form-group my-1">
            <label for="team">
                <b>
                    {{
                        'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.REASSIGN_MODAL.PROFILE_LABEL'
                            | translate
                    }}
                    <span class="text-danger">*</span>
                </b>
            </label>
            <p-select
                formControlName="profile"
                [options]="profiles()"
                optionLabel="label"
                optionValue="value"
                [loading]="loadingProfiles()"
                [filter]="true"
                filterBy="label"
                appendTo="body"
                [placeholder]="'COMMON.SELECT_PLACEHOLDER' | translate"
                styleClass="w-100"
                [class.ng-invalid]="
                    reassignForm.get('profile')?.invalid &&
                    reassignForm.get('profile')?.touched
                "
            ></p-select>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <p-button
            [label]="'COMMON.CANCEL' | translate"
            icon="pi pi-times"
            severity="danger"
            (onClick)="closeReassignModal()"
        ></p-button>
        <p-button
            [label]="'COMMON.SAVE' | translate"
            [icon]="
                facade.actionState() === 'loading'
                    ? 'pi pi-spin pi-spinner'
                    : 'pi pi-check'
            "
            (onClick)="onSubmitReassign()"
            [disabled]="
                reassignForm.invalid ||
                !usersSelectedInTable().length ||
                !profiles().length ||
                loadingProfiles() ||
                facade.actionState() === 'loading'
            "
        ></p-button>
    </ng-template>
</p-dialog>

<p-dialog
    [visible]="displayAssignModal()"
    (visibleChange)="displayAssignModal.set($event)"
    [modal]="true"
    [style]="{ width: '450px' }"
    [draggable]="false"
    [resizable]="false"
    header="{{
        'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.ASSIGN_MODAL.TITLE'
            | translate
    }}"
>
    <form [formGroup]="assignForm">
        <div class="form-group my-1">
            <label for="team">
                <b>
                    {{
                        'SETTINGS_SECURITY.PROFILES_PERMISSIONS_USERS.ASSIGN_MODAL.PROFILE_LABEL'
                            | translate
                    }}
                    <span class="text-danger">*</span>
                </b>
            </label>
            <p-multiselect
                formControlName="users"
                [options]="users()"
                [loading]="loadingUsers()"
                optionLabel="label"
                optionValue="value"
                [filter]="true"
                filterBy="label"
                [showToggleAll]="false"
                [showClear]="true"
                placeholder="{{ 'COMMON.SELECT_PLACEHOLDER' | translate }}"
                appendTo="body"
                styleClass="w-100"
                [class.ng-invalid]="
                    assignForm.get('users')?.invalid &&
                    assignForm.get('users')?.touched
                "
            />
        </div>
    </form>
    <ng-template pTemplate="footer">
        <p-button
            [label]="'COMMON.CANCEL' | translate"
            icon="pi pi-times"
            severity="danger"
            (onClick)="closeAssignModal()"
        ></p-button>
        <p-button
            [label]="'COMMON.SAVE' | translate"
            [icon]="
                facade.actionState() === 'loading'
                    ? 'pi pi-spin pi-spinner'
                    : 'pi pi-check'
            "
            (onClick)="onSubmitAssign()"
            [disabled]="
                assignForm.invalid ||
                !paramsUniqId().length ||
                !users().length ||
                loadingUsers() ||
                facade.actionState() === 'loading'
            "
        ></p-button>
    </ng-template>
</p-dialog>

<main class="container-fluid profiles-permissions-container" role="main">
    <section class="row profiles-permissions-row">
        <article class="col-sm-12 profiles-permissions-article">
            <app-breadcrumb />

            <section class="card profiles-permissions-card">
                <div class="card-body profiles-permissions-card-body">
                    <header class="profiles-permissions-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'SETTINGS_SECURITY.PROFILES_PERMISSIONS.TITLE'
                                    | translate
                                    | lowercase
                            "
                        ></app-page-title>
                    </header>

                    <p-tabs [value]="activeTab()">
                        <p-tablist>
                            @for (tab of tabs; track tab.route) {
                                <p-tab
                                    [value]="tab.route"
                                    [routerLink]="tab.route"
                                    [queryParams]="tab.queryParams"
                                >
                                    <i [class]="tab.icon"></i>
                                    <span>{{ tab.label | translate }}</span>
                                </p-tab>
                            }
                        </p-tablist>
                    </p-tabs>

                    <router-outlet></router-outlet>
                </div>
            </section>
        </article>
    </section>
</main>

<div class="fade-in profils-habilitations-content">
    <app-filter
        class="filter-component"
        [isLoading]="loading()"
        [formGroup]="form"
        [fields]="filterFields()"
        (filter)="onFilterClicked($event)"
        [filterState]="facade.currentFilter$"
        [limit]="5"
    ></app-filter>

    <hr class="profils-habilitations-divider" />

    <section class="table-section">
        <app-table
            class="table-component"
            [loading]="loading()"
            [items]="items()"
            [pagination]="pagination()"
            [config]="tableConfig"
            (refreshRequested)="onRefreshClicked()"
            (createRequested)="onNavigateToForm($event)"
            (editRequested)="onNavigateToForm($event)"
            (deleteRequested)="onDeleteClicked($event)"
            (badgeClicked)="onBadgeClicked($event)"
            [hiddenButtonOther]="false"
            dataKey="uniqId"
        ></app-table>

        <app-pagination
            class="pagination-component"
            [pagination]="pagination()"
            (pageChange)="onPageChangeClicked($event)"
        ></app-pagination>
    </section>
</div>

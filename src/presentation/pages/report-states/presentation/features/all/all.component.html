<main class="container-fluid all-container" role="main">
    <section class="row all-row">
        <article class="col-sm-12 all-article">
            <app-breadcrumb />

            <section class="card all-card">
                <div class="card-body all-card-body">
                    <header class="all-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="'REPORT_STATES.ALL.TITLE' | translate"
                        >
                        </app-page-title>
                    </header>
                        <div class="statistics-section">
                            <div class="statistics-grid">
                                @for (stat of typeStatistics(); track stat.label) {
                                    <div class="stat-card card-{{ stat.color }}" tabindex="0">
                                        <div class="card-content">
                                            <div class="stat-header">
                                                <div class="stat-value">
                                                    {{ stat.count }}
                                                </div>
                                                <div class="stat-icon-wrapper">
                                                    <i class="stat-icon pi {{ stat.icon }}"></i>
                                                </div>
                                            </div>
                                            <div class="stat-label">
                                                {{ stat.label | translate }}
                                            </div>
                                            <!-- @if (stat.subtitle) {
                                            <div class="stat-label">
                                                {{ stat.subtitle | translate }}
                                            </div>
                                            } -->
                                            @if (stat.rate != null) {
                                            <div class="stat-rate">
                                                <span class="rate-badge">{{ stat.rate }}%</span>
                                            </div>
                                            }
                                        </div>
                                    </div>
                                }
                            </div>
                        </div>

                    <div class="all-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked()"
                            [filterState]="facade.currentFilter$"
                            [limit]="4"
                        ></app-filter>

                        <hr class="all-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                dataKey="uniqId"
                                [config]="tableConfig"
                                [loading]="loading()"
                                [headerButtons]="headerButtons()"
                                [items]="itemsVM()"
                                [pagination]="pagination()"
                                (actionClicked)="onActionClicked($event)"
                                (headerButtonClicked)="onHeaderClicked($event)"
                            ></app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onChangePageClicked($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>

    @if (isVisibleDialog()) {
        <app-management-dialog
            [visible]="isVisibleDialog()"
            [uniqId]="selectedReportId()"
            [type]="selectedManagementType()"
            (visibleChange)="onVisibleDialogClicked($event)"
        ></app-management-dialog>
    }
</main>

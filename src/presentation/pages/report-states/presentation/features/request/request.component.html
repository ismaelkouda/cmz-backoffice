<main class="container-fluid request-container" role="main">
    <section class="row request-row">
        <article class="col-sm-12 request-article">
            <app-breadcrumb />

            <section class="card request-card">
                <div class="card-body request-card-body">
                    <header class="request-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="'REPORT_STATES.REQUEST.TITLE' | translate"
                        >
                        </app-page-title>
                        <p-button
                            [label]="'COMMON.CLOSE' | translate"
                            (onClick)="navigateToBack()"
                            styleClass="p-button-danger"
                        >
                        </p-button>
                    </header>

                    <div class="request-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked()"
                            [filterState]="facade.currentFilter$"
                            [limit]="4"
                        ></app-filter>

                        <hr class="request-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                dataKey="uniqId"
                                [config]="tableConfig"
                                [loading]="loading()"
                                [headerButtons]="headerButtons()"
                                [items]="itemsVM()"
                                [pagination]="pagination()"
                                (headerButtonClicked)="onHeaderClicked($event)"
                            ></app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onChangePageClicked($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>
</main>

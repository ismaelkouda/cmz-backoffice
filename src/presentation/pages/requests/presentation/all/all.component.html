<main class="container-fluid all-container" role="main">
    <section class="row all-row">
        <article class="col-sm-12 all-article">
            <app-breadcrumb />

            <section class="card all-card">
                <div class="card-body all-card-body">
                    <header class="all-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'REQUESTS.ALL.TITLE' | translate | lowercase
                            "
                        >
                        </app-page-title>
                    </header>

                    <div class="all-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked()"
                            [filterState]="facade.currentFilter$"
                            [limit]="4"
                        ></app-filter>

                        <hr class="tasks-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                dataKey="uniqId"
                                [config]="tableConfig"
                                [loading]="loading()"
                                [items]="itemsVM()"
                                [pagination]="pagination()"
                                (refreshRequested)="onRefreshClicked()"
                                (actionClicked)="onActionClicked($event)"
                                (export)="onExportClicked()"
                            >
                            </app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onPageChange($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>

    @if (reportTreatmentVisible()) {
        <app-management-dialog
            [visible]="reportTreatmentVisible()"
            [uniqId]="selectedReportId"             
            [type]="selectedManagementType()"
            (visibleChange)="onVisibleChange($event)"
        ></app-management-dialog>
    }
</main>

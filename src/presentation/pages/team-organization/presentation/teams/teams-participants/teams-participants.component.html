<main class="container-fluid teams-participants-container" team="main">
    <section class="row teams-participants-row">
        <article class="col-sm-12 teams-participants-article">
            <app-breadcrumb />

            <section class="card teams-participants-card">
                <div class="card-body teams-participants-card-body">
                    <header class="teams-participants-header">
                        <div class="d-flex align-items-center">
                            <app-page-title
                                class="page-title-component"
                                [displayDate]="false"
                                [title]="
                                    'TEAM_ORGANIZATION.TEAMS.PARTICIPANTS.TITLE'
                                        | translate
                                        | lowercase
                                "
                            >
                            </app-page-title>
                            <div class="ms-auto">
                                <p-tag
                                    severity="success"
                                    [value]="paramsName()"
                                />
                            </div>
                        </div>
                        <p-button
                            [label]="'COMMON.CLOSE' | translate"
                            (onClick)="onCancel()"
                            styleClass="p-button-danger"
                        >
                        </p-button>
                    </header>

                    <div class="fade-in teams-participants-content">
                        <!-- <div class="report-subtitle">
                            <div class="subtitle-item">
                                <span class="subtitle-label"
                                    >'TEAM_ORGANIZATION.TEAMS_PARTICIPANTS.NAME' | translate:</span
                                >
                                <p-tag
                                    [value]="departmentName()"
                                    [styleClass]="
                                        'department-name-tag ' +departmentName()"
                                    [rounded]="true"
                                ></p-tag>
                            </div>

                            <div class="subtitle-item">
                                <span class="subtitle-label">'COMMON.CREATED_AT' | translate:</span>
                                <span class="subtitle-value">{{departmentCreatedAt()}}</span>
                            </div>
                        </div> -->

                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="formFilter"
                            [fields]="filterFields()"
                            (filter)="onFilter($event)"
                            [filterState]="facade.currentFilter$"
                            [limit]="5"
                        ></app-filter>

                        <hr class="teams-participants-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                [loading]="loading()"
                                [items]="curentTeamsParticipants()"
                                [pagination]="pagination()"
                                [config]="tableConfig"
                                (refreshRequested)="onRefresh()"
                                dataKey="uniqId"
                                [headerButtons]="headerButtons()"
                                selectionMode="multiple"
                                [selection]="selectedParticipants()"
                                (selectionChange)="onSelectionChange($event)"
                                (headerButtonClicked)="
                                    onHeaderButtonClicked($event)
                                "
                            ></app-table>
                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onPageChange($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>
</main>

<ng-template #reassignModal let-modal>
    <form [formGroup]="reassignForm">
        <div class="modal-header">
            <h4 class="modal-title">
                {{
                    'TEAM_ORGANIZATION.TEAMS.PARTICIPANTS.MODAL.REASSIGN_TITLE'
                        | translate
                }}
            </h4>
            <button
                type="button"
                class="btn-close"
                aria-label="Close"
                (click)="closeReassignModal()"
            ></button>
        </div>
        <div class="modal-body" novalidate>
            <div class="form-group mb-3">
                <label for="team" class="form-label">
                    <b
                        >{{
                            'TEAM_ORGANIZATION.TEAMS.PARTICIPANTS.MODAL.REASSIGN_LABEL'
                                | translate
                        }}
                        <span class="text-danger">*</span></b
                    >
                </label>
                <p-select
                    id="team"
                    formControlName="team"
                    [options]="teams()"
                    optionLabel="label"
                    optionValue="value"
                    appendTo="body"
                    [placeholder]="'COMMON.SELECT_PLACEHOLDER' | translate"
                    [style]="{ width: '100%' }"
                    [class.ng-invalid]="
                        reassignForm.get('team')?.invalid &&
                        reassignForm.get('team')?.touched
                    "
                ></p-select>
                @if (
                    reassignForm.get('team')?.invalid &&
                    reassignForm.get('team')?.touched
                ) {
                    <small class="text-danger">
                        {{
                            'TEAM_ORGANIZATION.TEAMS.PARTICIPANTS.MODAL.REASSIGN_MODAL.PROFILE_REQUIRED'
                                | translate
                        }}
                    </small>
                }
            </div>
        </div>
        <div class="modal-footer">
            <button
                type="button"
                class="btn btn-danger"
                (click)="closeReassignModal()"
            >
                {{ 'COMMON.CANCEL' | translate }}
            </button>
            <button
                type="button"
                class="btn btn-primary"
                (click)="onSubmitReassign()"
                [disabled]="reassignForm.invalid"
            >
                {{ 'COMMON.SAVE' | translate }}
            </button>
        </div>
    </form>
</ng-template>

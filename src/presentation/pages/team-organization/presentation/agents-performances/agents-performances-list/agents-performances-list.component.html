<div class="fade-in agents-performances-content">
    <app-filter
        class="filter-component"
        [isLoading]="loading()"
        [formGroup]="form"
        [fields]="filterFields()"
        (filter)="onFilterClicked($event)"
        [filterState]="facade.currentFilter$"
        [limit]="5"
    ></app-filter>

    <hr class="agents-performances-divider" />

    <section class="table-section">
        <app-table
            class="table-component"
            [loading]="loading()"
            [items]="items()"
            [pagination]="pagination()"
            [config]="tableConfig"
            (refreshRequested)="onRefreshClicked()"
            (actionClicked)="onNavigateToForm($event)"
            (export)="onExportExcel()"
            [hiddenButtonOther]="true"
            dataKey="uniqId"
        ></app-table>

        <app-pagination
            class="pagination-component"
            [pagination]="pagination()"
            (pageChange)="onPageChangeClicked($event)"
        ></app-pagination>
    </section>
</div>

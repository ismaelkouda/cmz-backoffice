<main class="container-fluid agents-performances-container" role="main">
    <section class="row agents-performances-row">
        <article class="col-sm-12 agents-performances-article">
            <app-breadcrumb />

            <section class="card agents-performances-card">
                <div class="card-body agents-performances-card-body">
                    <header class="agents-performances-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'TEAM_ORGANIZATION.AGENTS_PERFORMANCES.TITLE'
                                    | translate
                                    | lowercase
                            "
                        ></app-page-title>
                    </header>

                    <div class="fade-in agents-performances-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="isLoading()"
                            [formGroup]="formFilter"
                            [fields]="filterFields()"
                            (filter)="filter($event)"
                            [filterState]="facade.currentFilter$"
                            [limit]="5"
                        ></app-filter>

                        <hr class="agents-performances-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                [loading]="isLoading()"
                                [items]="items()"
                                [pagination]="pagination()"
                                [config]="tableConfig"
                                (refreshRequested)="refresh()"
                                dataKey="uniqId"
                            ></app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onPageChange($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>
</main>

<main class="container-fluid sla-escalation-contacts-container" role="main">
    <section class="row">
        <article class="col-sm-12">
            <app-breadcrumb />
            <section class="card">
                <div class="card-body">
                    <app-page-title
                        [displayDate]="false"
                        [title]="'SLA.ESCALATION_CONTACTS.TITLE' | translate"
                    />
                    <p-tabs [value]="activeTab()">
                        <p-tablist>
                            @for (tab of tabs; track tab.value) {
                                <p-tab
                                    [value]="tab.value"
                                    [routerLink]="tab.route"
                                    [queryParams]="tab.queryParams"
                                >
                                    <i [class]="tab.icon"></i>
                                    <span>{{ tab.label | translate }}</span>
                                </p-tab>
                            }
                        </p-tablist>
                    </p-tabs>
                    <router-outlet />
                </div>
            </section>
        </article>
    </section>
</main>

<main class="container-fluid sla-list-container" role="main">
    <section class="row sla-list-row">
        <article class="col-sm-12 sla-list-article">
            <app-breadcrumb />

            <section class="card sla-list-card">
                <div class="card-body sla-list-card-body">
                    <header class="sla-list-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="'SLA.SLA_LIST.TITLE' | translate"
                        >
                        </app-page-title>
                    </header>

                    <div class="sla-list-content">
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked()"
                            [filterState]="facade.currentFilter$"
                            [limit]="4"
                        ></app-filter>

                        <hr class="sla-list-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                dataKey="id"
                                [config]="tableConfig"
                                [loading]="loading()"
                                [headerButtons]="headerButtons()"
                                [items]="itemsVM()"
                                (actionClicked)="onActionClicked($event)"
                                (headerButtonClicked)="onHeaderClicked($event)"
                            ></app-table>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>

    <app-sla-form
        [visible]="formVisible()"
        [mode]="formMode()"
        [item]="selectedItem()"
        (closed)="onFormClosed()"
        (saved)="onFormSaved($event)"
    ></app-sla-form>
</main>

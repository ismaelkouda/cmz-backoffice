<div class="sla-thresholds-content">
    <app-filter
        class="filter-component"
        [isLoading]="facade.loading()"
        [formGroup]="form"
        [fields]="fields()"
        (filter)="filter()"
    ></app-filter>

    <hr class="sla-thresholds-divider" />

    <section class="table-section">
        <app-table
            class="table-component"
            [config]="currentTableConfig()"
            [items]="currentItems()"
            [loading]="facade.loading()"
            [headerButtons]="headerButtons()"
            (headerButtonClicked)="onHeaderClicked($event)"
            (badgeClicked)="openChannels($event)"
            (actionClicked)="onAction($event)"
            dataKey="id"
        ></app-table>
    </section>
</div>

@if (system()) {
    <app-sla-system-form
        [visible]="formVisible()"
        [mode]="formMode()"
        [item]="selectedSystemItem()"
        (closed)="onFormClosed()"
        (saved)="onFormSaved($event)"
    />
}

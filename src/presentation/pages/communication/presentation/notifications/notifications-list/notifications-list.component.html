<main class="container-fluid notifications-container" role="main">
    <section class="row notifications-row">
        <article class="col-sm-12 notifications-article">
            <app-breadcrumb />

            <section class="card notifications-card">
                <div class="card-body notifications-card-body">
                    <header class="notifications-header">
                        <app-page-title
                            class="page-title-component"
                            [displayDate]="false"
                            [title]="
                                'COMMUNICATION.NOTIFICATIONS.TITLE'
                                    | translate
                                    | lowercase
                            "
                        ></app-page-title>
                    </header>

                    <div
                        class="notifications-content"
                        [class.fade-in]="hasAnimated()"
                    >
                        <app-filter
                            class="filter-component"
                            [isLoading]="loading()"
                            [formGroup]="form"
                            [fields]="filterFields()"
                            (filter)="onFilterClicked($event)"
                            [filterState]="facade.currentFilter$"
                            [limit]="5"
                        ></app-filter>

                        <hr class="teams-divider" />

                        <section class="table-section">
                            <app-table
                                class="table-component"
                                [loading]="loading()"
                                [items]="items()"
                                [pagination]="pagination()"
                                [config]="tableConfig"
                                [headerButtons]="headerButtons()"
                                (headerButtonClicked)="
                                    onHeaderButtonClicked($event)
                                "
                                (refreshRequested)="onRefreshClicked()"
                                (actionClicked)="onActionClicked($event)"
                                (export)="onExportClicked()"
                                dataKey="uniqId"
                            ></app-table>

                            <app-pagination
                                class="pagination-component"
                                [pagination]="pagination()"
                                (pageChange)="onPageChangeClicked($event)"
                            ></app-pagination>
                        </section>
                    </div>
                </div>
            </section>
        </article>
    </section>

    @if (reportTreatmentVisible) {
        <app-management-dialog
            [(visible)]="reportTreatmentVisible"
            [uniqId]="selectedReportId"
            (queues)="onReportTreatmentQueues()"
        ></app-management-dialog>
    }
</main>
